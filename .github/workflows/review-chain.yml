# The review chain (.agents/review-chain.md): Air's GitHub triggers don't fire on commit statuses,
# so this forwards the `air-chain/review` statuses that drive the chain to the Air automations'
# webhook triggers.
#   success "Verdict: approve" / failure "Verdict: need changes" → the address-review automation
#   pending "Ready for review"                                      → the review-pr automation
# Only people and apps with write access can set statuses, so every status here is trusted.
name: Review chain
on:
  status:
permissions: {}
concurrency:
  group: review-chain-${{ github.event.sha }}
  cancel-in-progress: false
jobs:
  forward:
    # Only the review chain's own status, not CI's or anyone else's.
    if: github.event.context == 'air-chain/review'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The default branch's script, never the pull request's code.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - name: Forward to the matching automation
        env:
          # The status goes through the environment, never into the script: it is untrusted text.
          CONTEXT: ${{ github.event.context }}
          STATE: ${{ github.event.state }}
          DESCRIPTION: ${{ github.event.description }}
          TARGET_URL: ${{ github.event.target_url }}
          SHA: ${{ github.event.sha }}
          REPOSITORY: ${{ github.repository }}
          SENDER: ${{ github.event.sender.login }}
          REVIEW_URL: ${{ secrets.AIR_REVIEW_WEBHOOK_URL }}
          REVIEW_TOKEN: ${{ secrets.AIR_REVIEW_WEBHOOK_TOKEN }}
          ADDRESS_URL: ${{ secrets.AIR_ADDRESS_WEBHOOK_URL }}
          ADDRESS_TOKEN: ${{ secrets.AIR_ADDRESS_WEBHOOK_TOKEN }}
        run: node .github/review-chain-forward.mjs
